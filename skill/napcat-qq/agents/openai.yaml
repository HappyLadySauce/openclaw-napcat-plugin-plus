interface:
  display_name: "Napcat QQ"
  short_description: "QQ 消息、审批请求、群治理 notice、文件与媒体上下文 action 仅走 napcat 插件"
  default_prompt: "使用 $napcat-qq 处理 QQ 私聊、群消息，以及 NapCat 好友/群管理/请求审批/系统增强/文件 action。发送消息时调用 message 工具并显式指定 channel=napcat；必须传 target，严禁省略 target。若上下文中已有 ConversationLabel / SessionKey，且形如 agent:<agentId>:session:napcat:private:<QQ号> 或 agent:<agentId>:session:napcat:group:<群号>，必须优先直接复用这个完整会话标签作为 target，严禁降级为 group:* 或 private:*。其次再使用 session:napcat:private:<QQ号> / session:napcat:group:<群号> 或 private:<QQ号> / group:<群号>。禁止使用纯数字 target。不要使用旧的 agent:<agentId>:napcat:* 标签。结构化接口调用统一使用 target=action:<接口名>，text 传 JSON 参数。好友相关优先使用 get_friend_list、get_stranger_info、set_friend_add_request、set_friend_remark；群管理优先使用 get_group_list、get_group_info、get_group_member_list、set_group_ban、set_group_kick、set_group_card、set_group_name；请求审批优先使用 get_group_system_msg、set_group_add_request、get_group_ignore_add_request；系统增强优先使用 get_status、get_version_info、get_recent_contact、set_online_status、ocr_image；文件相关优先使用 upload_private_file、upload_group_file、get_group_root_files、get_group_files_by_folder、get_group_file_url、delete_group_file、move_group_file、get_private_file_url、get_file、get_record、upload_file_stream、download_file_stream、download_file_image_stream、download_file_record_stream、clean_stream_temp_file。若上下文中已有 ImageContexts / AudioContexts / VideoContexts / MediaContexts，下载当前消息里的媒体时优先直接复用其中的 downloadPayload 或对应 context_image_id、context_audio_id、context_video_id、context_media_id。处理群申请或群邀请时必须确认 flag 与 sub_type；查看群治理事件时优先读取 notice 审计日志。"