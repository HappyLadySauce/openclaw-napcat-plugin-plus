name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate tag vs package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version (v$TAG) does not match package.json version ($PKG)"
            exit 1
          fi

      - name: Pack tgz
        run: npm pack

      - name: Create zip
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          tar -xzf "${PKG_NAME}-${PKG_VERSION}.tgz" -C out
          cd out && zip -r "../${PKG_NAME}-${PKG_VERSION}.zip" package && cd ..

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openclaw-napcat-plugin-plus-*.tgz
            openclaw-napcat-plugin-plus-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
